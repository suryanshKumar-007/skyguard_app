services:
  # ── FastAPI Backend (ML Anomaly Engine) ──
  - type: web
    name: skyguard-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://skyguardapp.streamlit.app

  # ── Streamlit Frontend (Live Dashboard) ──
  - type: web
    name: skyguard-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: SKYGUARD_API_URL
        value: https://skyguardai.onrender.com